[project]
name = "pd-tracker"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2",
    "django-authtools>=2.1.0",
    "psycopg>=3.3.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "djlint>=1.36.4",
]

[tool.djlint]
indent=2
format_js=true
format_css=true

[tool.djlint.css]
indent_size=2

[tool.djlint.js]
indent_size=2
