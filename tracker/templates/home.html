{% extends 'base.html' %}
{% block content %}
  <section class="grid">
    <a class="dashboard-button"
       href="{% url 'checkin-create' %}"
       role="button">Check In ✅</a>
    <a class="dashboard-button"
       href="{% url 'medicationlog-create' %}"
       role="button">Log Medication 💊</a>
    <a class="dashboard-button"
       href="{% url 'activitylog-create' %}"
       role="button">Log Activity 🏃‍♂️</a>
    {% if request.user.is_superuser %}
      <a class="dashboard-button" href="{% url 'admin:index' %}" role="button">Admin 🛠️</a>
    {% endif %}
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="dashboard-button" type="submit">Logout 🚪</button>
    </form>
  </section>
{% endblock %}
