{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PD Tracker</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet"
          type="text/css"
          href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="{% static 'js/loading.js' %}" defer></script>
    <script type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/toastify-js"
            defer></script>
    <script src="{% static 'js/toast.js' %}" defer></script>
    {% block extra_head %}{% endblock %}
    {{ toasts|json_script:"toasts-data" }}
  </head>
  <body>
    <main class="container">
      <header>
        <a href="{% url 'home' %}" class="logo">
          <h1 aria-busy="false" id="loading-indicator">PD Tracker</h1>
        </a>
      </header>
      {% if breadcrumbs %}
        {% include 'partials/_breadcrumbs.html' %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
