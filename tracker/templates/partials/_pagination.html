<nav aria-label="pagination">
  <div role="group" class="pagination">
    {% if page_obj.has_previous %}
      <a href="{% querystring page=page_obj.previous_page_number %}"
         class="secondary"
         role="button">Previous</a>
    {% else %}
      <button class="primary" disabled>Previous</button>
    {% endif %}
    <p class="current-page">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</p>
    {% if page_obj.has_next %}
      <a href="{% querystring page=page_obj.next_page_number %}"
         class="primary"
         role="button">Next</a>
    {% else %}
      <button class="primary" disabled>Next</button>
    {% endif %}
  </div>
</nav>
