{% extends 'base.html' %}
{% block content %}
  <h2>Medication Logs</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Medication Name</th>
        <th>Dosage</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody>
      {% for log in object_list %}
        <tr>
          <td>{{ log.medication.name }}</td>
          <td>{{ log.medication.dose }}</td>
          <td>{{ log.timestamp }}</td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="3">No medication logs found.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
