{% extends 'base.html' %}
{% block content %}
  <article>
    <header>
      <h2>Medication Logs</h2>
      <a href="{% url 'medicationlog-create' %}" role="button">New Medication Log</a>
    </header>
    <table class="table">
      <thead>
        <tr>
          <th>Medication Name</th>
          <th>Dosage</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        {% for log in object_list %}
          <tr>
            <td>{{ log.medication.name }}</td>
            <td>{{ log.medication.dose }}</td>
            <td>{{ log.timestamp }}</td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="3">No medication logs found.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </article>
{% endblock %}
